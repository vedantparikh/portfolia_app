services:    
  app:
    container_name: portfolio-ui
    build: ./js
    volumes:
      - ./js/src:/app/src
      - ./js/vite.config.js:/app/vite.config.js
    env_file:
      - ./js/.env.docker
    ports:
      - 3000:5173
    depends_on:
      api:
        condition: service_healthy
    networks:
      - homepage_proxy-network
    restart: no
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  api:
    container_name: portfolio-api
    build: 
      context: ./python/app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./python/app/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Development: Mount source code for live reload (exclude cache)
      - ./python/app/app:/app/app:delegated
      - ./python/app/schemas:/app/schemas:delegated
      - ./python/app/utils:/app/utils:delegated
      - ./python/app/api:/app/api:delegated
      - ./python/app/alembic:/app/alembic:delegated
      - ./python/app/alembic.ini:/app/alembic.ini:delegated
      - ./python/app/core:/app/core:delegated
      - ./python/app/config.py:/app/config.py:delegated
      - ./python/app/start_api.py:/app/start_api.py:delegated
      - ./python/app/start_api.sh:/app/start_api.sh:delegated
      - ./python/app/requirements.txt:/app/requirements.txt:delegated
      - ./python/app/health_check.py:/app/health_check.py:delegated
    networks:
      - homepage_proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  postgres:
    container_name: portfolio-db
    build:
      context: ./python/app
      dockerfile: Dockerfile.postgres
    env_file:
      - ./python/app/.env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homepage_proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: portfolio-redis
    build:
      context: ./python/app
      dockerfile: Dockerfile.redis
    env_file:
      - ./python/app/.env.docker
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - homepage_proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/myusb/postgres-data'
  redis_data:
    driver: local


networks:
  homepage_proxy-network:
    external: true
